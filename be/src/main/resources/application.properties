spring.application.name=be

# Idioma das mensagens de erro/validação, resolvido a partir do header
# Accept-Language enviado pelo frontend (que reflete o locale do next-intl).
spring.mvc.locale=pt-BR
spring.mvc.locale-resolver=accept-header

# Porta em que o servidor escuta. O Cloud Run injeta a variável PORT — sem
# isso aqui, o app sempre subiria na 8080 e ignoraria o valor real.
server.port=${PORT:8080}

# O Render fica atrás de um proxy: sem isso, request.getRemoteAddr() (usado
# pelo RateLimiter) sempre devolve o IP interno do proxy, não o do
# visitante — o que faria o rate limit valer pra todo mundo junto, em vez de
# por IP real. NATIVE ativa o RemoteIpValve do Tomcat, que lê X-Forwarded-For.
server.forward-headers-strategy=native

# Valores padrão apontam pro Postgres local. Em produção, defina
# SPRING_DATASOURCE_URL/USERNAME/PASSWORD com os dados do Supabase.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lkclone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=none

# Sem valor padrão de propósito: um fallback fixo aqui ficaria exposto pra
# sempre no histórico do git, e qualquer um que o veja forjaria token de
# qualquer usuário. Sem JWT_SECRET configurado, a aplicação falha ao subir
# em vez de assinar tokens com um segredo público. Gere um valor forte com
# `openssl rand -hex 32` e defina como variável de ambiente (nunca aqui).
jwt.secret=${JWT_SECRET}

# Origens permitidas por CORS, separadas por vírgula. Em produção, defina
# CORS_ALLOWED_ORIGINS com o(s) domínio(s) real(is) do frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# URL do frontend, usada para montar o link de redefinição de senha.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Supabase Storage (fotos de perfil). SUPABASE_URL é a URL do projeto
# (https://xxxx.supabase.co); SUPABASE_SERVICE_KEY é a service_role key
# (nunca a anon key — precisa de permissão de escrita no bucket).
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.service-role-jwt=${SUPABASE_SERVICE_ROLE_JWT:}
supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:avatars}
# Brevo (e-mail transacional). BREVO_FROM_EMAIL precisa ser o e-mail
# verificado como sender na sua conta Brevo (brevo.com/senders).
brevo.api-key=${BREVO_API_KEY:}
brevo.from-email=${BREVO_FROM_EMAIL:}
brevo.from-name=${BREVO_FROM_NAME:LinkPet}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
